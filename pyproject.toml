[project]
name = "video-compressor-runpod"
version = "1.0.0"
description = "GPU (NVENC) video compression, cutting and shorts service for RunPod Serverless"
requires-python = ">=3.11"
dependencies = ["runpod>=1.7,<2", "boto3>=1.34", "pydantic>=2,<3", "requests>=2.31"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
