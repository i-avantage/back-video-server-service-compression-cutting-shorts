name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg (CPU build, for the software-encoder integration tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests handler.py test_local.py scripts
      - name: Unit + CPU integration tests
        run: pytest -q
      - name: Local end-to-end run (software backend)
        run: python test_local.py --backend software --max-height 360 --shorts
